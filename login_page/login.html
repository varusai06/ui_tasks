<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= ,  initial-scale=1.0">
    <link rel="styleSheet" href="./styles/style.css">
    </link>
    <title>BadgerNewsLettter</title>
</head>

<body>
    <div class="login-background">
        <div class="signup-container">
            <div class="single-head-top">
                <span>
                    <h2>Sign In</h2>
                </span>
            </div>
            <form class="form-container" target="_blank">
                <div class="fields-container">
                    <label>Email *</label>
                    <input type="email" name="email" placeholder="Enter your mail ID">
                </div>
                <div class="fields-container">
                    <label>Password *</label>
                    <input type="password" name="password" placeholder="Enter your password">
                </div>

                <button type="submit">Sign In</button>
            </form>
            <div class="single-head-bottom">
                <span>CREATE AN ACCOUNT</span>
            </div>
            <div class="links-container">
                <a target="_blank">Sign in with Google</a>
                <a target="_blank">Sign in with Facebook</a>
                <a target="_blank">Sign in with GitHub</a>
                <a target="_blank">Sign in with SSO</a>
            </div>
            <div class="additional-container">
                <a target="_blank">Lost Password</a>
                <a target="_blank">Resend Verification email</a>
                <a target="_blank">Can't login? Click here</a>
            </div>
        </div>
    </div>
</body>

</html>
